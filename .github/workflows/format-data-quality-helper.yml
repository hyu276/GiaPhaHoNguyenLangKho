name: Format data quality helper

on:
  push:
    branches:
      - chore/format-data-quality

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/features/tree/data-quality.ts tests/unit/data-quality.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tree/data-quality.ts tests/unit/data-quality.test.ts
          git commit -m "style(quality): Format data quality"
          git push
