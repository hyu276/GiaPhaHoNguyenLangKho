name: Format diagnostic

on:
  push:
    branches:
      - feat/step-12a-product-ui-preview

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Show Prettier diff
        run: |
          npx prettier --write preview/app.js src/features/tree/components/data-quality-panel.tsx
          git diff --no-color -- preview/app.js src/features/tree/components/data-quality-panel.tsx
