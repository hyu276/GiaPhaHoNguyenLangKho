name: Format Provenance

on:
  push:
    branches:
      - feat/provenance-model

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/app/admin/tree/provenance-actions.ts src/features/tree/provenance-input.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/tree/provenance-actions.ts src/features/tree/provenance-input.ts
          git commit -m "style(provenance): Format source and citation code"
          git push
