name: Format release journeys helper

on:
  push:
    branches:
      - chore/format-release-journeys

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write preview/app.js preview/index.html preview/styles.css tests/e2e/admin-journeys.spec.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/app.js preview/index.html preview/styles.css tests/e2e/admin-journeys.spec.ts
          git commit -m "style(release): Format Step 10 journeys"
          git push
