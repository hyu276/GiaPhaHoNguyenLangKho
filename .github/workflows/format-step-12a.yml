name: Format Step 12A

on:
  push:
    branches:
      - feat/step-12a-product-ui
    paths:
      - ".github/workflows/format-step-12a.yml"
      - "preview/**"
      - "src/app/admin/login/page.tsx"
      - "src/app/admin/tree/page.tsx"
      - "src/features/tree/components/**"
      - "tests/e2e/**"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/step-12a-product-ui
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format Step 12A
        run: |
          npx prettier --write             preview/app.js             preview/index.html             preview/styles.css             src/app/admin/login/page.tsx             src/app/admin/tree/page.tsx             src/features/tree/components/admin-tree-editor.tsx             src/features/tree/components/audit-history-panel.tsx             src/features/tree/components/bulk-utilities-panel.tsx             src/features/tree/components/data-quality-panel.tsx             src/features/tree/components/duplicate-review-panel.tsx             src/features/tree/components/provenance-panel.tsx             tests/e2e/admin-journeys.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview src/app/admin src/features/tree/components tests/e2e/admin-journeys.spec.ts
          if git diff --cached --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git commit -m "style: format Step 12A"
          git push origin HEAD:feat/step-12a-product-ui
