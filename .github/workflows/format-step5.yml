name: Format Step 5

on:
  push:
    branches:
      - feat/layout-admin

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/features/tree/components/admin-tree-editor.tsx src/features/tree/tree-layout.ts src/features/tree/tree-navigation.ts tests/unit/tree-layout.test.ts tests/unit/tree-navigation.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tree/components/admin-tree-editor.tsx src/features/tree/tree-layout.ts src/features/tree/tree-navigation.ts tests/unit/tree-layout.test.ts tests/unit/tree-navigation.test.ts
          git commit -m "style: Format Step 5 changes"
          git push
