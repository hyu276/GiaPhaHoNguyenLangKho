name: Admin editor demo

on:
  push:
    branches:
      - main
      - feat/admin-preview-workflow
    paths:
      - "preview/**"
      - "docs/ADMIN-EDITOR-ROADMAP.md"
      - "vercel.json"
      - ".github/workflows/pages-preview.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: admin-editor-demo-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: admin-demo-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload demo
        uses: actions/upload-pages-artifact@v4
        with:
          path: preview

      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@v4
