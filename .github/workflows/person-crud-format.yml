name: Temporary person CRUD formatter

on:
  push:
    branches:
      - feat/person-crud-admin
    paths:
      - ".github/workflows/person-crud-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/person-crud-admin

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format Person CRUD files
        run: npx prettier --write src/app/admin/tree/actions.ts src/features/tree/components/admin-tree-editor.tsx src/features/tree/components/person-editor-form.tsx

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/tree/actions.ts src/features/tree/components/admin-tree-editor.tsx src/features/tree/components/person-editor-form.tsx
          git commit -m "style(person): Apply Prettier"
          git push origin HEAD:feat/person-crud-admin
