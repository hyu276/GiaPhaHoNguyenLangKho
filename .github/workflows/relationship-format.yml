name: Temporary relationship formatter

on:
  push:
    branches:
      - feat/relationship-domain
    paths:
      - ".github/workflows/relationship-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/relationship-domain

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format relationship files
        run: npx prettier --write src/app/admin/tree/relationship-actions.ts tests/unit/relationship-domain.test.ts

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/admin/tree/relationship-actions.ts tests/unit/relationship-domain.test.ts
          git commit -m "style(relationship): Apply Prettier"
          git push origin HEAD:feat/relationship-domain
