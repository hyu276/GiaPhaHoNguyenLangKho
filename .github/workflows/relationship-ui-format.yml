name: Temporary relationship UI formatter

on:
  push:
    branches:
      - feat/relationship-preview
    paths:
      - ".github/workflows/relationship-ui-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feat/relationship-preview

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format relationship UI
        run: npx prettier --write src/features/tree/components/relationship-editor-panel.tsx

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tree/components/relationship-editor-panel.tsx
          git commit -m "style(relationship): Format editor panel"
          git push origin HEAD:feat/relationship-preview
