name: Step 12A temporary formatter

on:
  push:
    branches:
      - feat/step-12a-product-ui-preview
    paths:
      - src/features/tree/components/admin-tree-editor.tsx

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply Step 12A formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/step-12a-product-ui-preview
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write src/features/tree/components/admin-tree-editor.tsx
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/tree/components/admin-tree-editor.tsx
          git commit -m "chore: apply Step 12A formatter"
          git push origin HEAD:feat/step-12a-product-ui-preview
