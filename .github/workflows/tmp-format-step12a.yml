name: Step 12A format diagnostic

on:
  push:
    branches:
      - feat/step-12a-product-ui-preview
    paths:
      - src/features/tree/components/admin-tree-editor.tsx
      - .github/workflows/tmp-format-step12a.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Show Prettier diff
        run: |
          npx prettier --write src/features/tree/components/admin-tree-editor.tsx
          git diff -- src/features/tree/components/admin-tree-editor.tsx
